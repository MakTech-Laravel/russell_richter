[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/php-fpm-error.log
stderr_logfile_maxbytes=10MB

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/nginx-error.log
stderr_logfile_maxbytes=10MB

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/queue-worker.sh
directory=/var/www
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
umask=002
redirect_stderr=true
; Log outside Coolify-mounted storage/logs so volume remounts cannot break the worker.
stdout_logfile=/var/log/supervisor/queue-worker_%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopwaitsecs=120
stopsignal=TERM
priority=15

[program:laravel-scheduler]
command=/bin/bash -c "while true; do /usr/local/bin/php /var/www/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www
autostart=true
autorestart=true
startretries=10
user=www-data
umask=002
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
priority=20

[program:google-reviews-sync]
command=/bin/bash -c "sleep 45 && while true; do /usr/local/bin/php /var/www/artisan reviews:sync-google --no-interaction || true; sleep 21600; done"
directory=/var/www
autostart=true
autorestart=true
startretries=10
user=www-data
umask=002
redirect_stderr=true
stdout_logfile=/var/log/supervisor/google-reviews-sync.log
stdout_logfile_maxbytes=10MB
priority=25
